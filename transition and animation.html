
<html>
<head>
    <title>Transition and Animation</title>

    <style>

        body {
            background-color: rgb(89, 43, 43);
        }

        h1 {
            text-align: center;
            color: white;
        }

        button {
            width: 100px;
            height: 50px;
            margin-left: 20px;
            background-color: brown;
            border: none;
            border-radius: 15px;
            transition: 1s;
        }

        button:hover {
            background-color: rgb(97, 228, 80);
            transform: scale(1.1);
        }

        .buttons {
            text-align: center;
        }

        .id1 {
            background: red;
        }

        .id2 {
            background: yellow;
        }

        .id3 {
            background: rgb(181, 196, 158);
        }

        .id4 {
            background: purple;
        }

        .id5 {
            background: rgb(41, 184, 241);
        }


        .shapes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 70px;
            margin-top: 100px;
            flex-wrap: wrap;
        }


        .box {
            width: 100px;
            height: 100px;
            background-color: red;
            animation: arjun 2s ease-in-out infinite alternate;
        }

        @keyframes arjun {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.5);
            }
        }


        .load {
            width: 80px;
            height: 80px;
            border: 8px solid white;
            border-radius: 50%;
            border-top: 8px solid blue;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        .triangle {
            width: 0;
            height: 0;
            border-left: 60px solid transparent;
            border-right: 60px solid transparent;
            border-bottom: 100px solid yellow;
            animation: spin1 4s ease-in infinite;
        }

        @keyframes spin1 {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        .diamond {
            width: 80px;
            height: 80px;
            background-color: orange;
            animation: spin2 5s linear infinite;
        }

        @keyframes spin2 {

            from {
                transform: rotate(45deg);
            }

            to {
                transform: rotate(405deg);
            }
        }


        .star {
            font-size: 100px;
            color: gold;
            animation: spin3 5s linear infinite;
        }

        @keyframes spin3 {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        .heart {
            font-size: 100px;
            color: red;
            animation: spin4 1s ease-in-out infinite alternate;
        }

        @keyframes spin4 {

            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.3);
            }
        }

    </style>
</head>


<body>

    <h1>Transition & Animation</h1>



    <div class="buttons">

        <button class="id1">Action</button>

        <button class="id2">Click</button>

        <button class="id3">Scale</button>

        <button class="id4">Circle</button>

        <button class="id5">Text</button>

    </div>



    <div class="shapes">

        <div class="box"></div>

        <div class="load"></div>

        <div class="triangle"></div>

        <div class="diamond"></div>

        <div class="star">★</div>

        <div class="heart">♥</div>

    </div>


</body>
</html>
